name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A push supersedes the build still running for the previous one — waiting
  # on a result nobody wants any more is the slowest part of a fast loop.
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The build publishes its IPA to a release, which needs more than the default
# read-only token.
permissions:
  contents: write

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Homebrew resolves and updates its whole index first, which costs more
      # than the tool itself. The release binary is one download.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          VERSION=2.43.0
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
          unzip -q xcodegen.zip
          # The bundled installer only writes itself; copying the two things
          # the release actually contains is both faster and predictable.
          sudo mkdir -p /usr/local/bin /usr/local/share
          sudo cp -R xcodegen/share/xcodegen /usr/local/share/
          sudo cp xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: Prepare secrets
        env:
          LAXIFY_ACCESS_KEY: ${{ secrets.LAXIFY_ACCESS_KEY }}
        run: |
          if [ -n "$LAXIFY_ACCESS_KEY" ]; then
            printf 'LAXIFY_ACCESS_KEY = %s\n' "$LAXIFY_ACCESS_KEY" > Config/Secrets.xcconfig
          else
            cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      # Restores the previous run's build products so only what changed is
      # recompiled. The fallback key matters more than an exact hit: a partial
      # match still saves most of the work.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ hashFiles('Laxify/**/*.swift', 'project.yml') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Laxify.xcodeproj \
            -scheme Laxify \
            -destination 'generic/platform=iOS' \
            -archivePath build/Laxify.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=incremental \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/Laxify.xcarchive/Products/Applications/Laxify.app/Info.plist")
          mkdir -p build/Payload
          cp -r "build/Laxify.xcarchive/Products/Applications/Laxify.app" build/Payload/
          cd build && zip -qr "Laxify_${VERSION}.ipa" Payload

      # The build goes to a release, not an artifact.
      #
      # Artifacts are charged against a 500MB allowance that twenty builds a
      # day fill in a fortnight, and once it is full the run still compiles
      # and then fails with nothing installable at the end — which is worth
      # nothing to the person waiting to install it. Worse, freeing space does
      # not help immediately: the usage figure is only recalculated every six
      # to twelve hours.
      #
      # A release asset is charged differently and, unlike an artifact, has a
      # stable address that does not expire — so "the latest build" is one
      # link rather than a hunt through runs.
      - name: Publish IPA to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA=$(ls build/Laxify_*.ipa | head -1)
          NOTE="Сборка из коммита ${GITHUB_SHA:0:7} — $(date -u '+%Y-%m-%d %H:%M UTC')"

          # One release, replaced each time, so the download link never moves.
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTE" --title "Последняя сборка"
            gh release upload latest "$IPA" --clobber
          else
            gh release create latest "$IPA" \
              --title "Последняя сборка" --notes "$NOTE" --prerelease
          fi

      - name: Upload IPA artifact
        # Best-effort: the release above is the one that has to work, and this
        # is only a convenience copy attached to the run itself. When the
        # artifact allowance is full it must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Laxify-unsigned-ipa
          path: build/Laxify_*.ipa
          retention-days: 3
